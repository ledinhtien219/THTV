name: Build Internal Test APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Internal Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Internal test build: v$VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Stable signing key missing: refusing to generate a different certificate."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test IPTV aspect retention
        run: node tests/iptv-aspect.test.cjs

      - name: Test page input and YouTube behavior
        run: |
          node tests/page-input.test.cjs
          node tests/youtube-quality.test.cjs
          node tests/youtube-search-routing.test.cjs
          node tests/home-ui-cleanup.test.cjs
          node tests/web-session-retention.test.cjs
          node tests/web-theme-safety.test.cjs
          node tests/web-adblock.test.cjs
          node tests/app-switching.test.cjs
          node tests/youtube-voice-toolbar.test.cjs
          node tests/waze-stability.test.cjs

      - name: Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: THTV-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}-INTERNAL-TEST
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload keyboard device test APK
        uses: actions/upload-artifact@v4
        with:
          name: THTV-v${{ steps.version.outputs.name }}-keyboard-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 30

      - name: Mark as internal only
        run: |
          echo "This workflow NEVER updates update.json and NEVER creates a public GitHub Release."
          echo "Use the 'Approve Stable Update' workflow after this build has been tested."
