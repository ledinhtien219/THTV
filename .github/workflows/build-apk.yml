name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Stable signing key missing: refusing to generate a different certificate."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test IPTV aspect retention
        run: node tests/iptv-aspect.test.cjs

      - name: Test page input and YouTube quality
        run: |
          node tests/page-input.test.cjs
          node tests/youtube-quality.test.cjs

      - name: Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THTV-v1.0.37-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload keyboard device test APK
        uses: actions/upload-artifact@v4
        with:
          name: THTV-v1.0.37-keyboard-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

      - name: Publish APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .versionName update.json)
          jq -r '.changelog[] | "- " + .' update.json > release-notes.txt
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace a published APK."
            exit 1
          fi
          gh release create "v$VERSION" app/build/outputs/apk/debug/*.apk \
            --target "$GITHUB_SHA" --title "THTV v$VERSION" --notes-file release-notes.txt
