<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Maps Live Traffic 3D</title>
    <link rel="stylesheet" href="leaflet.css">
    <script src="leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0F172A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 3D Perspective Viewport Container */
        #map-viewport {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            perspective: 750px;
            perspective-origin: 50% 80%;
            background: #0F172A;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 50% 80%;
            transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
            background: #0F172A;
        }

        /* 3D and 2D mode states */
        .mode-3d #map {
            transform: rotateX(54deg) scale(1.24);
        }
        .mode-2d #map {
            transform: rotateX(0deg) scale(1.0);
        }

        /* Night Mode Tile Filter */
        .night-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(90%);
        }
        .day-tiles {
            filter: none;
        }

        /* Vehicle Navigation Marker */
        .car-marker-container {
            width: 46px;
            height: 46px;
            position: relative;
            transform-origin: center center;
            transition: transform 0.25s linear;
        }
        .mode-3d .car-marker-container {
            filter: drop-shadow(0 14px 10px rgba(0, 0, 0, 0.75));
        }
        .car-pulse {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.28);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .car-arrow {
            position: absolute;
            top: 7px;
            left: 7px;
            width: 32px;
            height: 32px;
            background: #00E5FF;
            clip-path: polygon(50% 0%, 92% 85%, 50% 66%, 8% 85%);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.95);
            border: 2px solid #FFFFFF;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 0.9; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Floating HUD Controls */
        .map-hud {
            position: absolute;
            right: 12px;
            bottom: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .hud-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            user-select: none;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
        }
        .hud-btn:active {
            transform: scale(0.9);
            background: #00E5FF;
            color: #0A101D;
        }

        .hud-btn-3d {
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #00E5FF;
            border: 1px solid rgba(0, 229, 255, 0.4);
        }

        .traffic-badge {
            position: absolute;
            left: 10px;
            bottom: 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 8px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00E5FF;
            font-size: 10.5px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .traffic-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22C55E;
            box-shadow: 0 0 6px #22C55E;
        }

        /* Search & Directions Overlay */
        .search-modal {
            position: absolute;
            top: 10px;
            left: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 12px;
            padding: 10px;
            z-index: 2000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: none;
        }
        .search-box {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #FFFFFF;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
        }
        .search-btn {
            background: #0284C7;
            color: #FFF;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .search-close {
            background: #334155;
            color: #FFF;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .quick-chips {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .chip {
            background: #1E293B;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            color: #CBD5E1;
            padding: 4px 9px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip:active {
            background: #00E5FF;
            color: #0A101D;
        }
        .search-results {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .result-item {
            background: #1B2738;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11.5px;
            color: #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item:hover, .result-item:active {
            background: #0284C7;
        }
        .route-card {
            margin-top: 8px;
            padding: 10px;
            background: #091E14;
            border: 1px solid #10B981;
            border-radius: 8px;
            display: none;
        }
        .route-title {
            font-size: 12px;
            font-weight: bold;
            color: #FFFFFF;
        }
        .route-stats {
            font-size: 13.5px;
            font-weight: bold;
            color: #34D399;
            margin: 4px 0 8px 0;
        }
        .route-actions {
            display: flex;
            gap: 6px;
        }
        .btn-start-nav {
            flex: 1.2;
            background: #059669;
            color: #FFF;
            border: none;
            border-radius: 6px;
            padding: 7px 8px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-gmaps {
            flex: 1.2;
            background: #2563EB;
            color: #FFF;
            border: none;
            border-radius: 6px;
            padding: 7px 8px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-cancel {
            background: #475569;
            color: #FFF;
            border: none;
            border-radius: 6px;
            padding: 7px 8px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Map 3D Perspective Viewport -->
    <div id="map-viewport" class="mode-2d">
        <div id="map"></div>
    </div>

    <div class="traffic-badge" id="trafficBadge">
        <div class="traffic-dot"></div>
        <span>Google Maps &bull; Live Traffic</span>
    </div>

    <!-- Search / Directions Modal -->
    <div id="searchModal" class="search-modal">
        <div class="search-box">
            <input type="text" id="destInput" class="search-input" placeholder="T&#236;m &#273;&#7883;a &#273;i&#7875;m, c&#226;y x&#259;ng, nh&#224; h&#224;ng..." />
            <button id="btnDoSearch" class="search-btn">T&#236;m</button>
            <button id="btnCloseSearch" class="search-close">&#10005;</button>
        </div>
        <div class="quick-chips">
            <span class="chip" onclick="quickSearch('C&#226;y x&#259;ng')">&#9981; C&#226;y x&#259;ng</span>
            <span class="chip" onclick="quickSearch('B&#227;i &#273;&#7895; xe')">&#127359; B&#227;i xe</span>
            <span class="chip" onclick="quickSearch('Qu&#225;n cafe')">&#9749; Cafe</span>
            <span class="chip" onclick="quickSearch('B&#7878;nh vi&#7878;n')">&#127973; B&#7878;nh vi&#7878;n</span>
            <span class="chip" onclick="quickSearch('Nh&#224; h&#224;ng')">&#127860; Nh&#224; h&#224;ng</span>
        </div>
        <div id="searchResults" class="search-results"></div>
        <div id="routeInfoCard" class="route-card">
            <div class="route-title" id="routeDestName">&#272;i&#7875;m &#273;&#7871;n</div>
            <div class="route-stats" id="routeStatsText">-- km &bull; -- ph&#250;t</div>
            <div class="route-actions">
                <button id="btnStartNav" class="btn-start-nav">&#129517; D&#7851;n &#273;&#01B0;&#7893;ng</button>
                <button id="btnOpenGMaps" class="btn-gmaps">&#128205; Google Maps</button>
                <button id="btnClearRoute" class="btn-cancel">&#10005; H&#7911;y</button>
            </div>
        </div>
    </div>

    <!-- Floating HUD Controls -->
    <div class="map-hud">
        <div class="hud-btn" id="btnSearch" title="T&#236;m &#273;&#01B0;&#7893;ng / Ch&#7881; &#273;&#01B0;&#7893;ng" style="background: #047857; color: #FFF; font-size: 16px;">&#128269;</div>
        <div class="hud-btn hud-btn-3d" id="btn3D" title="Chuy&#7875;n g&#243;c nh&#236;n 3D / 2D">3D</div>
        <div class="hud-btn" id="btnZoomIn" title="Ph&#243;ng to">+</div>
        <div class="hud-btn" id="btnZoomOut" title="Thu nh&#7843;">&minus;</div>
        <div class="hud-btn" id="btnRecenter" title="V&#7883; tr&#237; xe">&#127919;</div>
        <div class="hud-btn" id="btnLayer" title="Chuy&#7875;n b&#7843;n &#273;&#7891;">&#127760;</div>
    </div>

    <script>
        let map;
        let carMarker;
        let routePolyline;
        let destMarker;
        let isNight = true;
        let is3D = false;
        let tileLayer;
        let currentMode = 0; // 0: Google Traffic, 1: Google Satellite, 2: OpenStreetMap
        let currentLat = 21.0285;
        let currentLng = 105.8542;
        let currentBearing = 0;
        let autoFollow = true;
        let selectedDest = null;
        let currentRouteData = null;

        const tileConfigs = [
            {
                url: 'https://mt{s}.google.com/vt/lyrs=m,traffic&x={x}&y={y}&z={z}',
                subdomains: ['0', '1', '2', '3'],
                maxZoom: 20,
                name: 'Google Maps Traffic'
            },
            {
                url: 'https://mt{s}.google.com/vt/lyrs=y,traffic&x={x}&y={y}&z={z}',
                subdomains: ['0', '1', '2', '3'],
                maxZoom: 20,
                name: 'V&#7871; tinh & Giao th&#244;ng'
            },
            {
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                subdomains: ['a', 'b', 'c'],
                maxZoom: 19,
                name: 'B&#7843;n &#273;&#7891; chu&#7849;n'
            }
        ];

        function initMap() {
            try {
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false,
                    fadeAnimation: true
                }).setView([currentLat, currentLng], 16);

                updateTileLayer();

                // Custom Car Direction Marker
                const carIcon = L.divIcon({
                    className: 'car-marker-wrap',
                    html: '<div class="car-marker-container" id="carMarkerInner"><div class="car-pulse"></div><div class="car-arrow"></div></div>',
                    iconSize: [46, 46],
                    iconAnchor: [23, 23]
                });

                carMarker = L.marker([currentLat, currentLng], { icon: carIcon }).addTo(map);

                map.on('dragstart', function() {
                    autoFollow = false;
                });

                document.getElementById('btnZoomIn').onclick = () => map.zoomIn();
                document.getElementById('btnZoomOut').onclick = () => map.zoomOut();
                document.getElementById('btnRecenter').onclick = () => {
                    autoFollow = true;
                    map.flyTo([currentLat, currentLng], is3D ? 17 : 16, { animate: true, duration: 0.6 });
                };
                document.getElementById('btnLayer').onclick = () => {
                    currentMode = (currentMode + 1) % tileConfigs.length;
                    updateTileLayer();
                };

                // 3D Perspective Toggle Button
                document.getElementById('btn3D').onclick = () => {
                    toggle3DMode();
                };

                // Search Modal toggles
                const searchModal = document.getElementById('searchModal');
                document.getElementById('btnSearch').onclick = () => {
                    searchModal.style.display = searchModal.style.display === 'block' ? 'none' : 'block';
                    if (searchModal.style.display === 'block') {
                        document.getElementById('destInput').focus();
                    }
                };
                document.getElementById('btnCloseSearch').onclick = () => {
                    searchModal.style.display = 'none';
                };
                document.getElementById('btnDoSearch').onclick = () => {
                    const q = document.getElementById('destInput').value.trim();
                    if (q) doSearch(q);
                };
                document.getElementById('destInput').onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        const q = document.getElementById('destInput').value.trim();
                        if (q) doSearch(q);
                    }
                };

                // Route action buttons
                document.getElementById('btnStartNav').onclick = () => {
                    if (currentRouteData && window.AndroidMap && window.AndroidMap.onRouteUpdated) {
                        window.AndroidMap.onRouteUpdated(currentRouteData.distStr, currentRouteData.timeStr, selectedDest ? selectedDest.name : '');
                    }
                    searchModal.style.display = 'none';
                };
                document.getElementById('btnOpenGMaps').onclick = () => {
                    if (selectedDest && window.AndroidMap && window.AndroidMap.startGoogleNavigation) {
                        window.AndroidMap.startGoogleNavigation(selectedDest.lat, selectedDest.lng, selectedDest.name);
                    }
                    searchModal.style.display = 'none';
                };
                document.getElementById('btnClearRoute').onclick = () => {
                    clearRoute();
                    document.getElementById('routeInfoCard').style.display = 'none';
                    if (window.AndroidMap && window.AndroidMap.onRouteCleared) {
                        window.AndroidMap.onRouteCleared();
                    }
                };

                if (window.AndroidMap && window.AndroidMap.onMapReady) {
                    window.AndroidMap.onMapReady();
                }
            } catch (err) {
                console.error("Map init error:", err);
            }
        }

        function toggle3DMode() {
            is3D = !is3D;
            const vp = document.getElementById('map-viewport');
            const btn = document.getElementById('btn3D');
            const badge = document.getElementById('trafficBadge');

            if (is3D) {
                vp.className = 'mode-3d';
                btn.innerHTML = '2D';
                btn.style.background = '#0284C7';
                btn.style.color = '#FFFFFF';
                btn.style.boxShadow = '0 0 14px rgba(0, 229, 255, 0.85)';
                if (badge) {
                    badge.querySelector('span').innerHTML = 'Google Maps &bull; 3D Mode';
                }
                map.setZoom(17);
            } else {
                vp.className = 'mode-2d';
                btn.innerHTML = '3D';
                btn.style.background = 'rgba(15, 23, 42, 0.88)';
                btn.style.color = '#00E5FF';
                btn.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.4)';
                if (badge) {
                    badge.querySelector('span').innerHTML = tileConfigs[currentMode].name;
                }
                map.setZoom(16);
            }
            if (carMarker) {
                map.panTo([currentLat, currentLng], { animate: true, duration: 0.5 });
            }
        }

        function updateTileLayer() {
            if (!map) return;
            if (tileLayer) {
                map.removeLayer(tileLayer);
            }
            const cfg = tileConfigs[currentMode];
            const tileClassName = (isNight && currentMode === 0) ? 'night-tiles' : 'day-tiles';
            
            tileLayer = L.tileLayer(cfg.url, {
                maxZoom: cfg.maxZoom,
                subdomains: cfg.subdomains,
                className: tileClassName
            }).addTo(map);

            const badge = document.getElementById('trafficBadge');
            if (badge && !is3D) {
                badge.querySelector('span').innerHTML = cfg.name;
            }
        }

        function updateCarLocation(lat, lng, bearing, speed) {
            if (!lat || !lng) return;
            currentLat = lat;
            currentLng = lng;
            currentBearing = bearing || 0;

            if (carMarker) {
                carMarker.setLatLng([lat, lng]);
                const inner = document.getElementById('carMarkerInner');
                if (inner) {
                    inner.style.transform = 'rotate(' + currentBearing + 'deg)';
                }
            }

            if (autoFollow && map) {
                map.panTo([lat, lng], { animate: true, duration: 0.4 });
            }
        }

        // Draw Blue Navigation Route Polyline onto Map
        function setRoute(coords) {
            try {
                if (routePolyline) {
                    map.removeLayer(routePolyline);
                    routePolyline = null;
                }
                if (destMarker) {
                    map.removeLayer(destMarker);
                    destMarker = null;
                }
                if (!coords || !Array.isArray(coords) || coords.length === 0) return;

                routePolyline = L.polyline(coords, {
                    color: '#2563EB',
                    weight: 7,
                    opacity: 0.9,
                    lineJoin: 'round',
                    lineCap: 'round'
                }).addTo(map);

                const lastPt = coords[coords.length - 1];
                if (lastPt) {
                    const pinIcon = L.divIcon({
                        className: 'dest-pin-wrap',
                        html: '<div style="font-size:24px; text-shadow:0 0 6px rgba(0,0,0,0.8);">&#128205;</div>',
                        iconSize: [30, 30],
                        iconAnchor: [15, 26]
                    });
                    destMarker = L.marker(lastPt, { icon: pinIcon }).addTo(map);
                }

                map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
            } catch (err) {
                console.error("setRoute error:", err);
            }
        }

        function clearRoute() {
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
            if (destMarker) {
                map.removeLayer(destMarker);
                destMarker = null;
            }
            currentRouteData = null;
        }

        function quickSearch(keyword) {
            document.getElementById('destInput').value = keyword;
            doSearch(keyword);
        }

        function doSearch(query) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '<div style="color:#94A3B8; font-size:12px; padding:6px;">&#272;ang t&#236;m ki&#7871;m...</div>';

            const url = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&lat=' + currentLat + '&lon=' + currentLng + '&limit=5';
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    resultsContainer.innerHTML = '';
                    if (!data.features || data.features.length === 0) {
                        resultsContainer.innerHTML = '<div style="color:#EF4444; font-size:12px; padding:6px;">Kh&#244;ng t&#236;m th&#7845;y &#273;&#7883;a &#273;i&#7875;m n&#224;y</div>';
                        return;
                    }

                    data.features.forEach(f => {
                        const props = f.properties || {};
                        const coords = f.geometry.coordinates; // [lng, lat]
                        const name = props.name || props.street || query;
                        const detail = [props.city, props.state, props.country].filter(Boolean).join(', ');

                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = '<div><strong>' + name + '</strong><div style="font-size:10px; color:#94A3B8;">' + detail + '</div></div><div>&#10148;</div>';
                        div.onclick = () => {
                            selectDestination(name, coords[1], coords[0]);
                        };
                        resultsContainer.appendChild(div);
                    });
                })
                .catch(err => {
                    console.error("Search error:", err);
                    resultsContainer.innerHTML = '<div style="color:#EF4444; font-size:12px; padding:6px;">L&#7895;i t&#236;m ki&#7871;m. Vui l&#242;ng th&#7917; l&#7841;i.</div>';
                });
        }

        function selectDestination(name, destLat, destLng) {
            selectedDest = { name: name, lat: destLat, lng: destLng };
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '<div style="color:#38BDF8; font-size:12px; padding:6px;">&#272;ang t&#237;nh tuy&#7871;n &#273;&#01B0;&#7893;ng...</div>';

            const osrmUrl = 'https://router.project-osrm.org/route/v1/driving/' + currentLng + ',' + currentLat + ';' + destLng + ',' + destLat + '?overview=full&geometries=geojson';
            fetch(osrmUrl)
                .then(r => r.json())
                .then(res => {
                    resultsContainer.innerHTML = '';
                    if (!res.routes || res.routes.length === 0) {
                        resultsContainer.innerHTML = '<div style="color:#EF4444; font-size:12px; padding:6px;">Kh&#244;ng t&#236;m th&#7845;y tuy&#7871;n &#273;&#01B0;&#7893;ng ph&#249; h&#7907;p.</div>';
                        return;
                    }

                    const route = res.routes[0];
                    const pts = route.geometry.coordinates.map(c => [c[1], c[0]]); // [lat, lng]
                    setRoute(pts);

                    const distKm = (route.distance / 1000).toFixed(1) + ' km';
                    const durMins = Math.round(route.duration / 60);
                    const durStr = durMins > 60 ? Math.floor(durMins / 60) + ' gi&#7901; ' + (durMins % 60) + ' ph&#250;t' : durMins + ' ph&#250;t';

                    currentRouteData = { distStr: distKm, timeStr: durStr };

                    const card = document.getElementById('routeInfoCard');
                    document.getElementById('routeDestName').innerText = name;
                    document.getElementById('routeStatsText').innerHTML = '&#9201; ' + durStr + ' &bull; &#128739; ' + distKm;
                    card.style.display = 'block';
                })
                .catch(err => {
                    console.error("OSRM Route error:", err);
                    resultsContainer.innerHTML = '<div style="color:#EF4444; font-size:12px; padding:6px;">L&#7895;i t&#237;nh tuy&#7871;n &#273;&#01B0;&#7893;ng.</div>';
                });
        }

        function setMapTheme(isDay) {
            isNight = !isDay;
            updateTileLayer();
        }

        window.onload = initMap;
    </script>
</body>
</html>
